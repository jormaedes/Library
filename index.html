<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Libary App</title>
</head>
<body>
	<div class="header">
		<div class="container">
			<div class="logo">📚 Libary App</div>
			<div class="info">
				<ul>
					<li>Total Books: <span class="tb-value"></span></li>
					<li>Books read: <span class="rb-value"></span></li>
					<li>Books not read: <span class="nrb-value"></span></li>
				</ul>
			</div>
			<button>+ Add book</button>
		</div>
	</div>

	<div class="books-list container">
		<div class="book">
			<p>Harry Potter</p>
			<p>J. K. Rowling</p>
			<p>331</p>
		</div>
	</div>

	<div class="footer">
		<p>Built by <a href="https://github.com/jormaedes">Jormaedes</a> as part of <a href="https://www.theodinproject.com/">The Odin Project</a></p>
		<p>&copy; 2026  all right reserved</p>
	</div>
	
	<script src="main.js"></script>
</body>
</html>
